
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exp1-results
  namespace: openshift-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: exp1-plugin-latency
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 18000
  template:
    metadata:
      labels:
        app: exp1-benchmark
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: benchmark-sa
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run_exp1_plugin_latency.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: exp1-benchmark-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        persistentVolumeClaim:
          claimName: exp1-results
