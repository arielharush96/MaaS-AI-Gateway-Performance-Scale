# HTTPRoutes for performance evaluation — one per ExternalModel.
# All models share the same backend (llm-d-inference-sim); the BBR plugin
# chain handles per-provider API translation.
#
#
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perf-gpt-4o-openai
  namespace: openshift-ingress
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
    namespace: openshift-ingress
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /gpt-4o-openai/
    backendRefs:
    - name: llm-d-inference-sim
      port: 8000
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
  - matches:
    - headers:
      - name: X-Gateway-Model-Name
        type: Exact
        value: gpt-4o-openai
      path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: llm-d-inference-sim
      port: 8000
