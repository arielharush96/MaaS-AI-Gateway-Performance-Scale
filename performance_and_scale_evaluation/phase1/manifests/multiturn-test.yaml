apiVersion: v1
kind: ConfigMap
metadata:
  name: multiturn-test-script
  namespace: openshift-ingress
data:
  run.sh: |
    #!/bin/bash
    set -e

    GATEWAY="http://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local:80"
    MODEL="gpt-4o-openai"
    TARGET="${GATEWAY}/${MODEL}"
    export OPENAI_API_KEY=$(cat /var/run/secrets/guidellm/token)

    echo "=== Multi-turn validation test ==="
    echo "Target: $TARGET"
    echo "Model: $MODEL"
    echo "Data: prompt_tokens=32,output_tokens=32,turns=3"
    echo "Duration: 30s, concurrency=1"
    echo ""

    guidellm benchmark run \
      --target "$TARGET" \
      --model "$MODEL" \
      --processor "gpt2" \
      --data "prompt_tokens=32,output_tokens=32,turns=3" \
      --profile concurrent \
      --rate 1 \
      --max-seconds 30 \
      --warmup 0 \
      --cooldown 0 \
      --backend-kwargs '{"stream": false}' \
      --output-dir /results \
      --outputs json

    echo ""
    echo "=== DONE ==="
    echo "Pod staying alive for data extraction..."
    tail -f /dev/null
---
apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-multiturn-test
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: multiturn-test-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        emptyDir: {}
