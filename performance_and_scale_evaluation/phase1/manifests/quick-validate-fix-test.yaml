apiVersion: v1
kind: ConfigMap
metadata:
  name: validate-fix-test-script
  namespace: openshift-ingress
data:
  parse_one.py: |
    import json, sys
    with open(sys.argv[1]) as f:
        d = json.load(f)
    b = d['benchmarks'][0]
    m = b['metrics']
    lat = m['request_latency']['successful']
    rt = m['request_totals']
    rps = m['requests_per_second']['successful']['mean']
    mean_ms = lat['mean'] * 1000
    p50 = lat['percentiles']['p50'] * 1000
    p99 = lat['percentiles']['p99'] * 1000
    mode = sys.argv[2]
    print(f"  {mode}: RPS={rps:.1f} mean={mean_ms:.1f}ms p50={p50:.1f}ms p99={p99:.1f}ms")
    print(f"  requests: {rt['successful']} successful, {rt['errored']} errored")
    print(f"  duration: {b['duration']:.1f}s")
  run.sh: |
    #!/bin/bash

    SIMULATOR="http://llm-d-inference-sim.openshift-ingress.svc.cluster.local:8000"
    GATEWAY="http://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local:80"
    export OPENAI_API_KEY=$(cat /var/run/secrets/guidellm/token)
    PROCESSOR="gpt2"
    BACKEND_KWARGS='{"stream": false, "validate_backend": false}'
    MAX_SEC=90
    WARMUP=30

    echo "============================================"
    echo " VALIDATE-FIX SMOKE TEST"
    echo " Testing: validate_backend=false"
    echo " 1 A/B pair: Anthropic small-c4"
    echo " Started: $(date -Iseconds)"
    echo "============================================"
    echo ""

    run_one() {
        local label="$1" target="$2" mode="$3"
        local dir="/results/${mode}"
        mkdir -p "$dir"

        echo ">>> [$mode] target=$target"
        timeout 180 guidellm benchmark run \
            --target "$target" \
            --model "claude-sonnet-anthropic" \
            --processor "$PROCESSOR" \
            --data "prompt_tokens=32,output_tokens=64" \
            --profile concurrent \
            --rate 4 \
            --max-seconds "$MAX_SEC" \
            --warmup "$WARMUP" \
            --cooldown 0.0 \
            --backend-kwargs "$BACKEND_KWARGS" \
            --output-dir "$dir" \
            --outputs json \
            --disable-progress \
            > "$dir/guidellm.log" 2>&1

        if [ -f "$dir/benchmarks.json" ]; then
            echo "  SUCCESS: benchmarks.json created"
            python3 /scripts/parse_one.py "$dir/benchmarks.json" "$mode"
        else
            echo "  FAILED: no benchmarks.json"
            echo "  --- Last 20 lines of log ---"
            tail -20 "$dir/guidellm.log"
            echo "  ---"
            exit 1
        fi
    }

    echo ""
    echo "=== TEST 1: Baseline (direct to simulator) ==="
    run_one "baseline" "$SIMULATOR" "baseline"
    echo ""

    echo "=== TEST 2: Gateway (body-based routing, validate_backend=false) ==="
    run_one "gateway" "$GATEWAY" "gateway"
    echo ""

    echo "============================================"
    echo " SMOKE TEST COMPLETE"
    echo " Finished: $(date -Iseconds)"
    echo "============================================"
    echo ""
    echo "=== RESULTS_READY ==="
    tail -f /dev/null
---
apiVersion: batch/v1
kind: Job
metadata:
  name: validate-fix-test
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: validate-fix-test
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: benchmark-sa
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run.sh"]
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
          subPath: validate-test
      volumes:
      - name: scripts
        configMap:
          name: validate-fix-test-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        emptyDir: {}
