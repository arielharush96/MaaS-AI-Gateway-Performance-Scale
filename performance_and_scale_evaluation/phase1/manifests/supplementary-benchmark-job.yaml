# Supplementary Benchmark Job
#
# Runs Experiment 1 (per-plugin latency) and Experiment 2 (multi-turn 50 errors)
# inside the GuideLLM pod.
#
# Prerequisites:
#   - ConfigMap "supplementary-benchmark-script" containing all scripts
#   - BBR deployed with --metrics-endpoint-auth=false
#   - BBR Service patched to expose port 9090
#   - llm-d-inference-sim deployed with --deterministic-tokens
#   - ExternalModel CRs + HTTPRoutes applied
#   - Secret "guidellm-token" exists
#   - ServiceAccount "benchmark-sa" with pod log read access
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supplementary-results
  namespace: openshift-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: supplementary-benchmark
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: supplementary-benchmark
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: benchmark-sa
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run_supplementary.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: supplementary-benchmark-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        persistentVolumeClaim:
          claimName: supplementary-results
