# MLflow Tracking Server — experiment visualization for performance benchmarks
# Mounts all result PVCs, uses SQLite backend on its own PVC.
# Access via: oc port-forward svc/mlflow -n openshift-ingress 5000:5000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: openshift-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: openshift-ingress
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.19.0
        command: ["mlflow", "server"]
        args:
        - "--host=0.0.0.0"
        - "--port=5000"
        - "--backend-store-uri=sqlite:///mlflow-data/mlflow.db"
        - "--default-artifact-root=/mlflow-data/artifacts"
        ports:
        - containerPort: 5000
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow-data
        - name: openai-results
          mountPath: /results/openai
          readOnly: true
        - name: multi-provider-results
          mountPath: /results/multi-provider
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-data
      - name: openai-results
        persistentVolumeClaim:
          claimName: stage12-ab-results
      - name: multi-provider-results
        persistentVolumeClaim:
          claimName: multi-provider-ab-results
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: openshift-ingress
  labels:
    app: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
