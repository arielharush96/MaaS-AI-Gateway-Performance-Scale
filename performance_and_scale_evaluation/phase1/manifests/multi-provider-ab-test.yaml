# Multi-Provider A/B Benchmark — All Providers
#
# Measures gateway overhead for every supported provider by running
# paired benchmarks: baseline (direct to simulator) vs gateway (through
# the MaaS AI Gateway with BBR plugin chain).
#
# Providers:
#   Full-translator (all sizes × all concurrency levels):
#     - claude-sonnet-anthropic  (Anthropic Messages API)
#     - claude-sonnet-vertex     (Vertex AI GenerateContent API)
#   Nil-translator (small=full, medium/large/xl=reduced):
#     - gpt-4o-openai   (OpenAI passthrough)
#     - gpt-4o-azure    (Azure OpenAI)
#     - gpt-4o-bedrock  (Bedrock OpenAI)
#
# Test matrix:
#   Full providers:  4 sizes × 10 concurrency + 3 turn depths × 3 concurrency = 49 A/B pairs each
#   Nil providers:   small×10 + (med+lrg+xl)×3 + turns×3 = 22 A/B pairs each
#   Total: 2×49 + 3×22 = 164 A/B pairs = 328 benchmarks
#
# Prerequisites:
#   - llm-d-inference-sim deployed with --deterministic-tokens
#   - ExternalModel CRs applied (external-models.yaml)
#   - HTTPRoutes applied (httproutes.yaml)
#   - guidellm-token secret exists
#   - benchmark-sa ServiceAccount exists
#
# Usage:
#   oc apply -f multi-provider-ab-test.yaml -n openshift-ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multi-provider-ab-results
  namespace: openshift-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-provider-ab-script
  namespace: openshift-ingress
data:
  parse.py: |
    import json, sys, os

    bench_dir = sys.argv[1]
    name = sys.argv[2]
    mode = sys.argv[3]
    pt = sys.argv[4]
    ot = sys.argv[5]
    conc = sys.argv[6]
    turns = sys.argv[7]
    csv_path = sys.argv[8]

    json_file = os.path.join(bench_dir, 'benchmarks.json')
    if not os.path.exists(json_file):
        print(f"  ERROR: {json_file} not found")
        sys.exit(1)

    with open(json_file) as f:
        data = json.load(f)

    b = data['benchmarks'][0]
    m = b['metrics']
    rt = m['request_totals']
    rps = m['requests_per_second']['successful']['mean']
    lat = m['request_latency']['successful']
    p50 = lat['percentiles']['p50'] * 1000
    p95 = lat['percentiles']['p95'] * 1000
    p99 = lat['percentiles']['p99'] * 1000
    mean_lat = lat['mean'] * 1000
    dur = b['duration']

    row = f"{name},{mode},{pt},{ot},{turns},{conc},{rt['successful']},{rt['errored']},{rps:.2f},{mean_lat:.1f},{p50:.1f},{p95:.1f},{p99:.1f},{dur:.1f}"
    with open(csv_path, 'a') as f:
        f.write(row + '\n')

    print(f"  {mode}: RPS={rps:.1f} mean={mean_lat:.1f}ms p50={p50:.1f}ms p95={p95:.1f}ms p99={p99:.1f}ms")

    os.remove(json_file)
  plugin_delta.py: |
    import sys, os, re
    from collections import defaultdict

    def parse_metrics(path):
        result = {}
        if not os.path.exists(path):
            return result
        with open(path) as f:
            for line in f:
                line = line.strip()
                if line.startswith('#') or not line:
                    continue
                m = re.match(r'(bbr_plugin_duration_seconds_(sum|count))\{(.+?)\}\s+([\d.e\-+]+)', line)
                if m:
                    metric, kind, labels, val = m.group(1), m.group(2), m.group(3), float(m.group(4))
                    result[(labels, kind)] = val
        return result

    before_file = sys.argv[1]
    after_file = sys.argv[2]
    csv_path = sys.argv[3]
    label = sys.argv[4]

    before = parse_metrics(before_file)
    after = parse_metrics(after_file)

    plugins = set()
    for (labels, kind) in after:
        plugins.add(labels)

    write_header = not os.path.exists(csv_path) or os.path.getsize(csv_path) == 0
    with open(csv_path, 'a') as f:
        if write_header:
            f.write("benchmark,extension_point,plugin_type,plugin_name,requests,avg_latency_us\n")
        for labels in sorted(plugins):
            s_before = before.get((labels, 'sum'), 0)
            c_before = before.get((labels, 'count'), 0)
            s_after = after.get((labels, 'sum'), 0)
            c_after = after.get((labels, 'count'), 0)
            ds = s_after - s_before
            dc = c_after - c_before
            if dc > 0:
                avg_us = (ds / dc) * 1_000_000
                ldict = dict(kv.split('=', 1) for kv in labels.split(','))
                ep = ldict.get('extension_point', '').strip('"')
                pt = ldict.get('plugin_type', '').strip('"')
                pn = ldict.get('plugin_name', '').strip('"')
                f.write(f"{label},{ep},{pt},{pn},{int(dc)},{avg_us:.1f}\n")
                print(f"    {ep}/{pn}: {avg_us:.1f}µs ({int(dc)} reqs)")
  prom_monitor.py: |
    #!/usr/bin/env python3
    """
    Prometheus monitor — collects CPU, memory, and network metrics for all
    MaaS stack pods every INTERVAL seconds. Writes per-metric CSV files and
    tracks which benchmark is active via /results/.current_benchmark.
    """
    import urllib.request, urllib.parse, ssl, json, os, sys, time, signal

    PROM_URL = "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091/api/v1/query"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    RESULTS_DIR = "/results/prometheus"
    INTERVAL = 5
    STOP_FILE = "/results/.monitor_stop"
    NAMESPACE = "openshift-ingress"
    POD_REGEX = "payload-processing.*|maas-default.*|llm-d-inference-sim.*|kube-auth-proxy.*|data-science-gateway.*"

    QUERIES = {
        "cpu": f'sum(rate(container_cpu_usage_seconds_total{{namespace="{NAMESPACE}",pod=~"{POD_REGEX}",container!="POD",container!=""}}[30s])) by (pod)',
        "memory": f'container_memory_working_set_bytes{{namespace="{NAMESPACE}",pod=~"{POD_REGEX}",container!="POD",container!=""}}',
        "net_rx": f'sum(rate(container_network_receive_bytes_total{{namespace="{NAMESPACE}",pod=~"{POD_REGEX}"}}[30s])) by (pod)',
        "net_tx": f'sum(rate(container_network_transmit_bytes_total{{namespace="{NAMESPACE}",pod=~"{POD_REGEX}"}}[30s])) by (pod)',
    }

    shutdown = False
    def handle_signal(signum, frame):
        global shutdown
        shutdown = True
    signal.signal(signal.SIGTERM, handle_signal)
    signal.signal(signal.SIGINT, handle_signal)

    os.makedirs(RESULTS_DIR, exist_ok=True)

    token = open(TOKEN_PATH).read().strip()
    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE

    csv_files = {}
    for metric_name in QUERIES:
        path = os.path.join(RESULTS_DIR, f"{metric_name}.csv")
        f = open(path, "w")
        f.write("timestamp,pod,value\n")
        f.flush()
        csv_files[metric_name] = f

    benchmark_label_path = "/results/.current_benchmark"
    bench_csv = open(os.path.join(RESULTS_DIR, "benchmark_markers.csv"), "w")
    bench_csv.write("timestamp,benchmark\n")
    bench_csv.flush()

    print(f"[prom_monitor] Started. Interval={INTERVAL}s, writing to {RESULTS_DIR}")
    print(f"[prom_monitor] Monitoring pods matching: {POD_REGEX}")
    sys.stdout.flush()

    cycle = 0
    last_benchmark = ""
    while not shutdown and not os.path.exists(STOP_FILE):
        ts = time.strftime("%Y-%m-%dT%H:%M:%S", time.gmtime())

        cur_bench = ""
        if os.path.exists(benchmark_label_path):
            try:
                cur_bench = open(benchmark_label_path).read().strip()
            except:
                pass
        if cur_bench != last_benchmark:
            bench_csv.write(f"{ts},{cur_bench}\n")
            bench_csv.flush()
            last_benchmark = cur_bench
            if cur_bench:
                print(f"[prom_monitor] Benchmark: {cur_bench}")
                sys.stdout.flush()

        for metric_name, query in QUERIES.items():
            try:
                url = PROM_URL + "?" + urllib.parse.urlencode({"query": query})
                req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                resp = urllib.request.urlopen(req, context=ctx, timeout=10)
                data = json.loads(resp.read())
                if data.get("status") == "success":
                    for result in data["data"]["result"]:
                        pod = result["metric"].get("pod", "unknown")
                        val = result["value"][1]
                        csv_files[metric_name].write(f"{ts},{pod},{val}\n")
                    csv_files[metric_name].flush()
            except Exception as e:
                if cycle == 0:
                    print(f"[prom_monitor] WARN: {metric_name} query failed: {e}")
                    sys.stdout.flush()

        cycle += 1
        if cycle % 60 == 0:
            print(f"[prom_monitor] {cycle} samples collected ({cycle * INTERVAL}s elapsed)")
            sys.stdout.flush()

        for _ in range(INTERVAL * 10):
            if shutdown or os.path.exists(STOP_FILE):
                break
            time.sleep(0.1)

    for f in csv_files.values():
        f.close()
    bench_csv.close()
    print(f"[prom_monitor] Stopped after {cycle} samples.")
    sys.stdout.flush()
  run.sh: |
    #!/bin/bash

    SIMULATOR="http://llm-d-inference-sim.openshift-ingress.svc.cluster.local:8000"
    GATEWAY="http://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local:80"
    METRICS_URL="http://payload-processing.openshift-ingress.svc.cluster.local:9090/metrics"
    export OPENAI_API_KEY=$(cat /var/run/secrets/guidellm/token)
    RESULTS="/results"
    PROCESSOR="gpt2"
    BACKEND_KWARGS='{"stream": false, "validate_backend": false}'
    MAX_SEC=180
    BENCH_TIMEOUT=300
    WARMUP=60
    COOLDOWN=0.0
    CSV="$RESULTS/summary.csv"
    PLUGIN_CSV="$RESULTS/plugin_latency.csv"
    CSV_DUMP_EVERY=10

    echo "provider,benchmark,mode,prompt_tokens,output_tokens,turns,concurrency,successful,errored,rps,mean_ms,p50_ms,p95_ms,p99_ms,duration_s" > "$CSV"

    TOTAL=0; PASS=0; FAIL=0

    echo "============================================"
    echo " Multi-Provider A/B Test"
    echo " All Providers: OpenAI, Azure, Bedrock, Anthropic, Vertex"
    echo "============================================"
    echo " Simulator: TTFT=1ms, ITL=1ms, --deterministic-tokens"
    echo " Baseline:  $SIMULATOR/v1/chat/completions (direct, OpenAI format)"
    echo " Gateway:   $GATEWAY/v1/chat/completions (body-based routing)"
    echo "            BBR extracts model -> header-based route match"
    echo "            BBR translates body + sets :path to native endpoint"
    echo " Metrics:   $METRICS_URL (plugin latency)"
    echo " Duration:  ${MAX_SEC}s per benchmark (warmup: ${WARMUP}s, effective: $((MAX_SEC - WARMUP))s)"
    echo " Hard timeout: ${BENCH_TIMEOUT}s"
    echo " Mode:      NON-STREAMING"
    echo ""
    echo " Nil-translator providers (reduced matrix, 22 A/B pairs each):"
    echo "   - gpt-4o-openai    (passthrough)"
    echo "   - gpt-4o-azure     (Azure OpenAI)"
    echo "   - gpt-4o-bedrock   (Bedrock OpenAI)"
    echo " Full-translator providers (full matrix, 49 A/B pairs each):"
    echo "   - claude-sonnet-anthropic  (Anthropic Messages API)"
    echo "   - claude-sonnet-vertex     (Vertex AI GenerateContent API)"
    echo ""
    echo " Total: 3×22 + 2×49 = 164 A/B pairs = 328 benchmarks"
    echo " Estimated runtime: ~30 hours"
    echo ""
    echo " Prometheus: CPU, memory, network every 5s"
    echo " Started:   $(date -Iseconds)"
    echo "============================================"
    echo ""

    python3 /scripts/prom_monitor.py &
    MONITOR_PID=$!
    echo "[run.sh] Prometheus monitor started (PID $MONITOR_PID)"

    dump_csv() {
        echo ""
        echo "=== CSV_DUMP START ($(date -Iseconds)) ==="
        cat "$CSV"
        echo "=== CSV_DUMP END ==="
        echo ""
    }

    run_bench() {
        local provider_label="$1" model="$2" name="$3" target="$4" mode="$5" pt="$6" ot="$7" concurrency="$8" turns="${9:-}"
        local dir="$RESULTS/${provider_label}/${name}/${mode}"
        mkdir -p "$dir"
        TOTAL=$((TOTAL + 1))

        local data_arg="prompt_tokens=${pt},output_tokens=${ot}"
        [ -n "$turns" ] && data_arg="${data_arg},turns=${turns}"

        timeout "${BENCH_TIMEOUT}" guidellm benchmark run \
            --target "$target" \
            --model "$model" \
            --processor "$PROCESSOR" \
            --data "$data_arg" \
            --profile concurrent \
            --rate "$concurrency" \
            --max-seconds "$MAX_SEC" \
            --warmup "$WARMUP" \
            --cooldown "$COOLDOWN" \
            --backend-kwargs "$BACKEND_KWARGS" \
            --output-dir "$dir" \
            --outputs json \
            --disable-progress \
            > "$dir/guidellm.log" 2>&1 || true

        if [ -f "$dir/benchmarks.json" ]; then
            python3 /scripts/parse.py "$dir" "${provider_label}/${name}" "$mode" "$pt" "$ot" "$concurrency" "${turns:-0}" "$CSV" || \
                echo "  WARN: parse failed"
            PASS=$((PASS + 1))
        else
            echo "  FAILED ($mode) - see $dir/guidellm.log"
            tail -3 "$dir/guidellm.log" 2>/dev/null || true
            FAIL=$((FAIL + 1))
        fi

        if (( TOTAL % CSV_DUMP_EVERY == 0 )); then
            dump_csv
        fi
    }

    scrape_metrics() {
        local outfile="$1"
        python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$METRICS_URL" "$outfile" 2>/dev/null || true
    }

    run_ab() {
        local provider_label="$1" model="$2" name="$3" pt="$4" ot="$5" concurrency="$6" turns="${7:-}"
        local metrics_dir="$RESULTS/${provider_label}/${name}/plugin_metrics"
        mkdir -p "$metrics_dir"

        echo "${provider_label}/${name}" > /results/.current_benchmark

        echo ""
        echo ">>> [${provider_label}/${name}] pt=$pt ot=$ot c=$concurrency${turns:+ turns=$turns}"

        # Baseline: direct to simulator (OpenAI format)
        run_bench "$provider_label" "$model" "$name" "$SIMULATOR" "baseline" "$pt" "$ot" "$concurrency" "$turns"

        # Gateway: body-based routing (model in JSON body, BBR extracts it)
        scrape_metrics "$metrics_dir/before.prom"
        run_bench "$provider_label" "$model" "$name" "${GATEWAY}" "gateway" "$pt" "$ot" "$concurrency" "$turns"
        scrape_metrics "$metrics_dir/after.prom"
        if [ -s "$metrics_dir/before.prom" ] && [ -s "$metrics_dir/after.prom" ]; then
            echo "  --- Plugin latency (${provider_label}/${name}) ---"
            python3 /scripts/plugin_delta.py "$metrics_dir/before.prom" "$metrics_dir/after.prom" "$PLUGIN_CSV" "${provider_label}/${name}" || \
                echo "  WARN: plugin_delta.py failed"
            rm -f "$metrics_dir/before.prom" "$metrics_dir/after.prom"
        fi
    }

    ALL_LEVELS=(2 4 8 16 32 64 128 256 512 1024)
    REDUCED_LEVELS=(8 64 512)
    MT_LEVELS_FULL=(4 32 128)
    MT_LEVELS_REDUCED=(32)

    run_full_provider() {
        local model="$1"
        local pair_count=49

        echo ""
        echo "###################################################"
        echo " Provider: $model"
        echo " Mode: FULL-TRANSLATOR (all sizes × all levels)"
        echo " Routing: body-based"
        echo " $pair_count A/B pairs"
        echo "###################################################"
        echo ""

        echo "=== All payload sizes - FULL 10 levels each ==="
        for spec in "small:32:64" "medium:256:512" "large:1024:1024" "very-large:2048:2048"; do
            IFS=: read -r pname pt ot <<< "$spec"
            for C in "${ALL_LEVELS[@]}"; do
                run_ab "$model" "$model" "payload-${pname}-c${C}" "$pt" "$ot" "$C"
            done
        done

        echo ""
        echo "=== Multi-Turn - FULL (turns: 1,10,50 × c=4,32,128) ==="
        for turns in 1 10 50; do
            for C in "${MT_LEVELS_FULL[@]}"; do
                run_ab "$model" "$model" "multiturn-${turns}-c${C}" 64 128 "$C" "$turns"
            done
        done

        echo ""
        echo ">>> $model COMPLETE ($PASS passed, $FAIL failed so far)"
        dump_csv
        echo "--- Plugin latency so far ---"
        cat "$PLUGIN_CSV" 2>/dev/null || echo "(no plugin data yet)"
        echo "---"
    }

    run_nil_provider() {
        local model="$1"
        local pair_count=22

        echo ""
        echo "###################################################"
        echo " Provider: $model"
        echo " Mode: NIL-TRANSLATOR (reduced medium/large/xl)"
        echo " Routing: body-based"
        echo " $pair_count A/B pairs"
        echo "###################################################"
        echo ""

        echo "=== Small payload (32/64) - FULL 10 levels ==="
        for C in "${ALL_LEVELS[@]}"; do
            run_ab "$model" "$model" "payload-small-c${C}" 32 64 "$C"
        done

        echo ""
        echo "=== Medium payload (256/512) - REDUCED 3 levels ==="
        for C in "${REDUCED_LEVELS[@]}"; do
            run_ab "$model" "$model" "payload-medium-c${C}" 256 512 "$C"
        done

        echo ""
        echo "=== Large payload (1024/1024) - REDUCED 3 levels ==="
        for C in "${REDUCED_LEVELS[@]}"; do
            run_ab "$model" "$model" "payload-large-c${C}" 1024 1024 "$C"
        done

        echo ""
        echo "=== Very-large payload (2048/2048) - REDUCED 3 levels ==="
        for C in "${REDUCED_LEVELS[@]}"; do
            run_ab "$model" "$model" "payload-very-large-c${C}" 2048 2048 "$C"
        done

        echo ""
        echo "=== Multi-Turn - REDUCED (turns: 1,10,50 × c=32 only) ==="
        for turns in 1 10 50; do
            for C in "${MT_LEVELS_REDUCED[@]}"; do
                run_ab "$model" "$model" "multiturn-${turns}-c${C}" 64 128 "$C" "$turns"
            done
        done

        echo ""
        echo ">>> $model COMPLETE ($PASS passed, $FAIL failed so far)"
        dump_csv
        echo "--- Plugin latency so far ---"
        cat "$PLUGIN_CSV" 2>/dev/null || echo "(no plugin data yet)"
        echo "---"
    }

    # -------------------------------------------------------
    # Run all providers
    # -------------------------------------------------------

    # Full-translator providers (full test matrix)
    run_full_provider "claude-sonnet-anthropic"
    run_full_provider "claude-sonnet-vertex"

    # Nil-translator providers (reduced test matrix)
    run_nil_provider "gpt-4o-openai"
    run_nil_provider "gpt-4o-azure"
    run_nil_provider "gpt-4o-bedrock"

    # -------------------------------------------------------
    # Done — signal completion and keep pod alive for extraction
    # -------------------------------------------------------
    echo "" > /results/.current_benchmark
    touch /results/.monitor_stop

    wait "$MONITOR_PID" 2>/dev/null || true

    echo ""
    echo "============================================"
    echo " MULTI-PROVIDER A/B TEST COMPLETE"
    echo " Total: $TOTAL  Passed: $PASS  Failed: $FAIL"
    echo " Finished: $(date -Iseconds)"
    echo "============================================"
    echo ""
    echo "=== FINAL CSV DUMP ==="
    cat "$CSV"
    echo "=== END FINAL CSV DUMP ==="
    echo ""
    echo "=== PLUGIN LATENCY CSV DUMP ==="
    cat "$PLUGIN_CSV" 2>/dev/null || echo "(no plugin data)"
    echo "=== END PLUGIN LATENCY CSV DUMP ==="
    echo ""
    echo "=== PROMETHEUS MONITORING SUMMARY ==="
    for f in /results/prometheus/*.csv; do
        echo "  $(basename $f): $(wc -l < $f) lines"
    done
    echo "=== END PROMETHEUS SUMMARY ==="
    echo ""
    echo "=== DISK USAGE ==="
    df -h /results
    du -sh /results/*
    echo "=== END DISK USAGE ==="
    echo ""
    echo "=== RESULTS_READY ==="
    echo "Pod staying alive. Data on PVC: multi-provider-ab-results"
    tail -f /dev/null
---
apiVersion: batch/v1
kind: Job
metadata:
  name: multi-provider-ab-test
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: multi-provider-ab-test
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: benchmark-sa
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: multi-provider-ab-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        persistentVolumeClaim:
          claimName: multi-provider-ab-results
