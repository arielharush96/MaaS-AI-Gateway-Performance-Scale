# Experiment 3: HPA Scaling Test
#
# Tests horizontal scaling impact on errors, latency, and RPS.
# Multi-turn 50 + single-turn at saturation concurrency, varying replicas.
# Estimated runtime: ~20 min per replica count
#
# Usage: run for each replica count (1, 2, 4, 8):
#   1. Scale BBR: oc scale deploy/payload-processing --replicas=N -n openshift-ingress
#   2. Wait for rollout: oc rollout status deploy/payload-processing -n openshift-ingress
#   3. Delete previous job: oc delete job exp3-hpa -n openshift-ingress --ignore-not-found
#   4. Update REPLICA_COUNT and TARGET_CONCURRENCY args in the job spec below
#   5. Apply: oc apply -f exp3-benchmark-job.yaml -n openshift-ingress
#
# Prerequisites:
#   - ConfigMap "exp3-benchmark-script" created from all scripts
#   - Same infra as Experiment 1
#
# Create ConfigMap:
#   oc create configmap exp3-benchmark-script \
#     --from-file=run_exp3_hpa.sh=scripts/benchmark/run_exp3_hpa.sh \
#     --from-file=parse_hpa.py=scripts/benchmark/parse_hpa.py \
#     --from-file=prom_monitor.py=scripts/benchmark/prom_monitor.py \
#     --from-file=plugin_delta.py=scripts/benchmark/plugin_delta.py \
#     -n openshift-ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exp3-results
  namespace: openshift-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: exp3-hpa
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: exp3-benchmark
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: benchmark-sa
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run_exp3_hpa.sh", "1", "128", "50"]
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: exp3-benchmark-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        persistentVolumeClaim:
          claimName: exp3-results
