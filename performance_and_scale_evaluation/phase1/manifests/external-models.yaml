# ExternalModel CRs for performance evaluation.
# Each CR maps a model name to a provider API format. All models route to
# the in-cluster llm-d-inference-sim; the "endpoint" field is metadata only
# (routing is handled by HTTPRoutes).
#
# Nil-translator models (body passes through, only path changes):
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gpt-4o-openai
  namespace: openshift-ingress
spec:
  provider: openai
  endpoint: llm-d-inference-sim.openshift-ingress.svc.cluster.local
  targetModel: testmodel
  credentialRef:
    name: openai-creds
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gpt-4o-azure
  namespace: openshift-ingress
spec:
  provider: azure-openai
  endpoint: llm-d-inference-sim.openshift-ingress.svc.cluster.local
  targetModel: testmodel
  credentialRef:
    name: azure-openai-creds
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gpt-4o-bedrock
  namespace: openshift-ingress
spec:
  provider: bedrock-openai
  endpoint: llm-d-inference-sim.openshift-ingress.svc.cluster.local
  targetModel: testmodel
  credentialRef:
    name: bedrock-creds
