# GuideLLM all-providers test through MaaS AI Gateway.
# Runs: 1 baseline (direct) + 5 gateway tests (openai, anthropic, azure, bedrock, vertex)
#
# Prerequisites:
#   - llm-d-inference-sim deployed with all model aliases + provider routes
#   - payload-processing running with EnvoyFilter on maas-default-gateway
#   - SA token stored in secret: oc create secret generic guidellm-token --from-literal=token=<TOKEN>
#
# Usage:
#   TOKEN=$(oc create token default --audience=maas-default-gateway-sa -n openshift-ingress --duration=120m)
#   oc delete secret guidellm-token -n openshift-ingress --ignore-not-found
#   oc create secret generic guidellm-token --from-literal=token=$TOKEN -n openshift-ingress
#   oc delete job guidellm-gateway-test -n openshift-ingress --ignore-not-found
#   oc delete configmap guidellm-test-script -n openshift-ingress --ignore-not-found
#   oc apply -f guidellm-gateway-test.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: guidellm-test-script
  namespace: openshift-ingress
data:
  run-tests.sh: |
    #!/bin/bash
    set -e

    GATEWAY_URL="http://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local:80"
    DIRECT_URL="http://llm-d-inference-sim.openshift-ingress.svc.cluster.local:8000"
    export OPENAI_API_KEY=$(cat /var/run/secrets/guidellm/token)
    export GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL=INFO
    RESULTS_DIR="/results"
    mkdir -p $RESULTS_DIR/baseline-direct $RESULTS_DIR/gateway-openai $RESULTS_DIR/gateway-anthropic $RESULTS_DIR/gateway-azure $RESULTS_DIR/gateway-bedrock $RESULTS_DIR/gateway-vertex

    # Common benchmark parameters
    PROFILE="synchronous"
    MAX_SECONDS="120"
    MAX_REQUESTS="50"
    DATA="prompt_tokens=128,output_tokens=128"
    PROCESSOR="gpt2"
    BACKEND_KWARGS='{"stream": false}'

    echo "============================================"
    echo "AI Gateway Performance Test - All Providers"
    echo "============================================"
    echo "Gateway: $GATEWAY_URL"
    echo "Direct:  $DIRECT_URL"
    echo "Mode:    NON-STREAMING (stream=false)"
    echo "Profile: $PROFILE | Max requests: $MAX_REQUESTS | Max seconds: $MAX_SECONDS"
    echo ""

    # -------- BASELINE: Direct to simulator --------
    echo ">>> [1/6] BASELINE: Direct to simulator (no gateway)"
    guidellm benchmark run \
      --target "$DIRECT_URL" \
      --model "gpt-4o-openai" \
      --processor "$PROCESSOR" \
      --data "$DATA" \
      --profile "$PROFILE" \
      --max-seconds "$MAX_SECONDS" \
      --max-requests "$MAX_REQUESTS" \
      --backend-kwargs "$BACKEND_KWARGS" \
      --output-dir "$RESULTS_DIR/baseline-direct" \
      --outputs json \
      --disable-progress 2>&1 | tee "$RESULTS_DIR/baseline-direct.log"
    echo ""

    # -------- GATEWAY TEST 1: OpenAI provider --------
    echo ">>> [2/6] GATEWAY: OpenAI provider (gpt-4o-openai)"
    guidellm benchmark run \
      --target "$GATEWAY_URL/gpt-4o-openai" \
      --model "gpt-4o-openai" \
      --processor "$PROCESSOR" \
      --data "$DATA" \
      --profile "$PROFILE" \
      --max-seconds "$MAX_SECONDS" \
      --max-requests "$MAX_REQUESTS" \
      --backend-kwargs "$BACKEND_KWARGS" \
      --output-dir "$RESULTS_DIR/gateway-openai" \
      --outputs json \
      --disable-progress 2>&1 | tee "$RESULTS_DIR/gateway-openai.log"
    echo ""

    # -------- GATEWAY TEST 2: Anthropic provider --------
    echo ">>> [3/6] GATEWAY: Anthropic provider (claude-sonnet-anthropic)"
    guidellm benchmark run \
      --target "$GATEWAY_URL/claude-sonnet-anthropic" \
      --model "claude-sonnet-anthropic" \
      --processor "$PROCESSOR" \
      --data "$DATA" \
      --profile "$PROFILE" \
      --max-seconds "$MAX_SECONDS" \
      --max-requests "$MAX_REQUESTS" \
      --backend-kwargs "$BACKEND_KWARGS" \
      --output-dir "$RESULTS_DIR/gateway-anthropic" \
      --outputs json \
      --disable-progress 2>&1 | tee "$RESULTS_DIR/gateway-anthropic.log"
    echo ""

    # -------- GATEWAY TEST 3: Azure OpenAI provider --------
    echo ">>> [4/6] GATEWAY: Azure OpenAI provider (gpt-4o-azure)"
    guidellm benchmark run \
      --target "$GATEWAY_URL/gpt-4o-azure" \
      --model "gpt-4o-azure" \
      --processor "$PROCESSOR" \
      --data "$DATA" \
      --profile "$PROFILE" \
      --max-seconds "$MAX_SECONDS" \
      --max-requests "$MAX_REQUESTS" \
      --backend-kwargs "$BACKEND_KWARGS" \
      --output-dir "$RESULTS_DIR/gateway-azure" \
      --outputs json \
      --disable-progress 2>&1 | tee "$RESULTS_DIR/gateway-azure.log"
    echo ""

    # -------- GATEWAY TEST 4: Bedrock OpenAI provider --------
    echo ">>> [5/6] GATEWAY: Bedrock OpenAI provider (gpt-4o-bedrock)"
    guidellm benchmark run \
      --target "$GATEWAY_URL/gpt-4o-bedrock" \
      --model "gpt-4o-bedrock" \
      --processor "$PROCESSOR" \
      --data "$DATA" \
      --profile "$PROFILE" \
      --max-seconds "$MAX_SECONDS" \
      --max-requests "$MAX_REQUESTS" \
      --backend-kwargs "$BACKEND_KWARGS" \
      --output-dir "$RESULTS_DIR/gateway-bedrock" \
      --outputs json \
      --disable-progress 2>&1 | tee "$RESULTS_DIR/gateway-bedrock.log"
    echo ""

    # -------- GATEWAY TEST 5: Vertex AI provider --------
    echo ">>> [6/6] GATEWAY: Vertex AI provider (gemini-pro-vertex)"
    guidellm benchmark run \
      --target "$GATEWAY_URL/gemini-pro-vertex" \
      --model "gemini-pro-vertex" \
      --processor "$PROCESSOR" \
      --data "$DATA" \
      --profile "$PROFILE" \
      --max-seconds "$MAX_SECONDS" \
      --max-requests "$MAX_REQUESTS" \
      --backend-kwargs "$BACKEND_KWARGS" \
      --output-dir "$RESULTS_DIR/gateway-vertex" \
      --outputs json \
      --disable-progress 2>&1 | tee "$RESULTS_DIR/gateway-vertex.log"
    echo ""

    echo "============================================"
    echo "ALL TESTS COMPLETE"
    echo "Results:"
    find $RESULTS_DIR -name "*.json" -exec echo {} \; -exec cat {} \; -exec echo \;
    echo "============================================"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: guidellm-gateway-test
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: guidellm-gateway-test
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run-tests.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 4Gi
      volumes:
      - name: scripts
        configMap:
          name: guidellm-test-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        emptyDir: {}
