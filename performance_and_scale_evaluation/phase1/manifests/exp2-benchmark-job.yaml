# Experiment 2: Multi-Turn 50 Error Investigation
#
# turns=50, small payload (64/128), c=4 and c=8, all 5 providers.
# Captures BBR logs before/after each run for root-cause analysis.
# Estimated runtime: ~30 minutes
#
# Prerequisites:
#   - ConfigMap "exp2-benchmark-script" created from all scripts
#   - Same infra as Experiment 1
#
# Create ConfigMap:
#   oc create configmap exp2-benchmark-script \
#     --from-file=run_exp2_multiturn_errors.sh=scripts/benchmark/run_exp2_multiturn_errors.sh \
#     --from-file=parse.py=scripts/benchmark/parse.py \
#     --from-file=prom_monitor.py=scripts/benchmark/prom_monitor.py \
#     --from-file=plugin_delta.py=scripts/benchmark/plugin_delta.py \
#     -n openshift-ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exp2-results
  namespace: openshift-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: exp2-multiturn-errors
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: exp2-benchmark
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: benchmark-sa
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run_exp2_multiturn_errors.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: exp2-benchmark-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        persistentVolumeClaim:
          claimName: exp2-results
