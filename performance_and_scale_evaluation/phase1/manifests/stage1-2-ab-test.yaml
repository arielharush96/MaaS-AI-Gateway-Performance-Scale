apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stage12-ab-results
  namespace: openshift-ingress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stage12-ab-test-script
  namespace: openshift-ingress
data:
  parse.py: |
    import json, sys, os

    bench_dir = sys.argv[1]
    name = sys.argv[2]
    mode = sys.argv[3]
    pt = sys.argv[4]
    ot = sys.argv[5]
    conc = sys.argv[6]
    turns = sys.argv[7]
    csv_path = sys.argv[8]

    json_file = os.path.join(bench_dir, 'benchmarks.json')
    if not os.path.exists(json_file):
        print(f"  ERROR: {json_file} not found")
        sys.exit(1)

    with open(json_file) as f:
        data = json.load(f)

    b = data['benchmarks'][0]
    m = b['metrics']
    rt = m['request_totals']
    rps = m['requests_per_second']['successful']['mean']
    lat = m['request_latency']['successful']
    p50 = lat['percentiles']['p50'] * 1000
    p95 = lat['percentiles']['p95'] * 1000
    p99 = lat['percentiles']['p99'] * 1000
    mean_lat = lat['mean'] * 1000
    dur = b['duration']

    row = f"{name},{mode},{pt},{ot},{turns},{conc},{rt['successful']},{rt['errored']},{rps:.2f},{mean_lat:.1f},{p50:.1f},{p95:.1f},{p99:.1f},{dur:.1f}"
    with open(csv_path, 'a') as f:
        f.write(row + '\n')

    print(f"  {mode}: RPS={rps:.1f} mean={mean_lat:.1f}ms p50={p50:.1f}ms p95={p95:.1f}ms p99={p99:.1f}ms")
  run.sh: |
    #!/bin/bash

    SIMULATOR="http://llm-d-inference-sim.openshift-ingress.svc.cluster.local:8000"
    GATEWAY="http://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local:80"
    MODEL="gpt-4o-openai"
    export OPENAI_API_KEY=$(cat /var/run/secrets/guidellm/token)
    RESULTS="/results"
    PROCESSOR="gpt2"
    NON_STREAMING='{"stream": false}'
    MAX_SEC=30
    BENCH_TIMEOUT=90
    WARMUP=0.1
    COOLDOWN=0.0
    CSV="$RESULTS/summary.csv"
    CSV_DUMP_EVERY=10

    echo "benchmark,mode,prompt_tokens,output_tokens,turns,concurrency,successful,errored,rps,mean_ms,p50_ms,p95_ms,p99_ms,duration_s" > "$CSV"

    TOTAL=0; PASS=0; FAIL=0

    echo "============================================"
    echo " Stage 1+2 A/B Test Pipeline"
    echo "============================================"
    echo " Simulator: TTFT=1ms, ITL=1ms"
    echo " Baseline:  $SIMULATOR"
    echo " Gateway:   $GATEWAY/$MODEL"
    echo " Duration:  ${MAX_SEC}s per benchmark (hard timeout: ${BENCH_TIMEOUT}s)"
    echo " Mode:      NON-STREAMING"
    echo " Section 1: 40 A/B pairs (payload x concurrency)"
    echo " Section 2: 9 A/B pairs (multi-turn: turns=1,10,50 x c=4,32,128)"
    echo " Total:     49 A/B pairs = 98 benchmarks (~40 min)"
    echo " Data:      PVC stage12-ab-results (persistent)"
    echo " Started:   $(date -Iseconds)"
    echo "============================================"
    echo ""

    dump_csv() {
        echo ""
        echo "=== CSV_DUMP START ($(date -Iseconds)) ==="
        cat "$CSV"
        echo "=== CSV_DUMP END ==="
        echo ""
    }

    run_bench() {
        local name="$1" target="$2" mode="$3" pt="$4" ot="$5" concurrency="$6" turns="${7:-}"
        local dir="$RESULTS/${name}/${mode}"
        mkdir -p "$dir"
        TOTAL=$((TOTAL + 1))

        local data_arg="prompt_tokens=${pt},output_tokens=${ot}"
        [ -n "$turns" ] && data_arg="${data_arg},turns=${turns}"

        timeout "${BENCH_TIMEOUT}" guidellm benchmark run \
            --target "$target" \
            --model "$MODEL" \
            --processor "$PROCESSOR" \
            --data "$data_arg" \
            --profile concurrent \
            --rate "$concurrency" \
            --max-seconds "$MAX_SEC" \
            --warmup "$WARMUP" \
            --cooldown "$COOLDOWN" \
            --backend-kwargs "$NON_STREAMING" \
            --output-dir "$dir" \
            --outputs json \
            --disable-progress \
            > "$dir/guidellm.log" 2>&1 || true

        if [ -f "$dir/benchmarks.json" ]; then
            python3 /scripts/parse.py "$dir" "$name" "$mode" "$pt" "$ot" "$concurrency" "${turns:-0}" "$CSV" || \
                echo "  WARN: parse failed"
            PASS=$((PASS + 1))
        else
            echo "  FAILED ($mode) - see $dir/guidellm.log"
            tail -3 "$dir/guidellm.log" 2>/dev/null || true
            FAIL=$((FAIL + 1))
        fi

        if (( TOTAL % CSV_DUMP_EVERY == 0 )); then
            dump_csv
        fi
    }

    run_ab() {
        local name="$1" pt="$2" ot="$3" concurrency="$4" turns="${5:-}"
        echo ""
        echo ">>> [$name] pt=$pt ot=$ot c=$concurrency${turns:+ turns=$turns}"
        run_bench "$name" "$SIMULATOR" "baseline" "$pt" "$ot" "$concurrency" "$turns"
        run_bench "$name" "${GATEWAY}/${MODEL}" "gateway" "$pt" "$ot" "$concurrency" "$turns"
    }

    echo "=== Section 1/2: Payload Size x Concurrency (40 A/B pairs = 80 benchmarks) ==="

    PAYLOADS="small:32:64 medium:256:512 large:1024:1024 very-large:2048:2048"
    LEVELS=(2 4 8 16 32 64 128 256 512 1024)

    for spec in $PAYLOADS; do
        IFS=: read -r pname pt ot <<< "$spec"
        for C in "${LEVELS[@]}"; do
            run_ab "payload-${pname}-c${C}" "$pt" "$ot" "$C"
        done
    done

    echo ""
    echo "=== Section 2/2: Multi-Turn x Concurrency (9 A/B pairs = 18 benchmarks) ==="
    echo "    turns: 1, 10, 50 | concurrency: 4, 32, 128"

    MULTI_TURNS="1:64:128 10:64:128 50:64:128"
    MT_LEVELS=(4 32 128)
    for spec in $MULTI_TURNS; do
        IFS=: read -r turns pt ot <<< "$spec"
        for C in "${MT_LEVELS[@]}"; do
            run_ab "multiturn-${turns}-c${C}" "$pt" "$ot" "$C" "$turns"
        done
    done

    echo ""
    echo "============================================"
    echo " A/B TEST PIPELINE COMPLETE"
    echo " Total: $TOTAL  Passed: $PASS  Failed: $FAIL"
    echo " Finished: $(date -Iseconds)"
    echo "============================================"
    echo ""
    echo "=== FINAL CSV DUMP ==="
    cat "$CSV"
    echo "=== END FINAL CSV DUMP ==="
    echo ""
    echo "=== RESULTS_READY ==="
    echo "Pod staying alive. Data on PVC: stage12-ab-results"
    tail -f /dev/null
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stage12-ab-test
  namespace: openshift-ingress
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: stage12-ab-test
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      containers:
      - name: guidellm
        image: ghcr.io/vllm-project/guidellm:v0.6.0
        command: ["/bin/bash", "/scripts/run.sh"]
        resources:
          requests:
            cpu: "4"
            memory: 4Gi
          limits:
            cpu: "8"
            memory: 8Gi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: token
          mountPath: /var/run/secrets/guidellm
          readOnly: true
        - name: results
          mountPath: /results
      volumes:
      - name: scripts
        configMap:
          name: stage12-ab-test-script
          defaultMode: 0755
      - name: token
        secret:
          secretName: guidellm-token
      - name: results
        persistentVolumeClaim:
          claimName: stage12-ab-results
